<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pavo · Foldkit</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/resources/fonts/inter/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
    <link href="/src/styles.css" rel="stylesheet" />
    <script>
      try {
        var stored = JSON.parse(localStorage.getItem('pavo-foldkit-theme') || '"System"');
        var dark = stored === 'Dark' || (stored !== 'Light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
